schema_version: 1

context:
  name: expression
  version: "5.7.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 4c5ea4247f871b8724ad580911ad73c1550fc653bb669daf2d49e4b645cc4770

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling >=1.27.0,<2
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }},<4.0
    - typing-extensions >=4.6.0

tests:
  - python:
      imports:
        - expression
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Practical functional programming for Python 3.9+"
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cognitedata/Expression

extra:
  recipe-maintainers:
    - thewchan
