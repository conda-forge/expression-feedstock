schema_version: 1

context:
  name: expression
  version: "6.0.1"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8916493f6e6392a413f13096af2099ec43f8e433022f19862788f61b708b1435

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - hatchling >=1.27.0,<2
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }},<4.0
    - typing_extensions >=4.6.0

tests:
  - python:
      imports:
        - expression
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Practical functional programming for Python 3.9+"
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cognitedata/Expression

extra:
  recipe-maintainers:
    - thewchan
